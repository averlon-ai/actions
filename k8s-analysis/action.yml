name: 'Averlon Misconfiguration Remediation Agent for Kubernetes'
description: 'Kubernetes Helm chart misconfiguration detection and remediation'
author: 'Averlon'

inputs:
  averlon-api-key:
    description: 'API key for authentication with Averlon'
    required: true
  averlon-api-secret:
    description: 'API secret for authentication with Averlon'
    required: true
  api-key:
    description: '[Deprecated] API key for authentication (use averlon-api-key instead)'
    required: false
  api-secret:
    description: '[Deprecated] API secret for authentication (use averlon-api-secret instead)'
    required: false
  manifest-file:
    description: |
      Path to a YAML file containing Kubernetes resources from `helm template` or plain K8s YAML.
      Typical generation:
        helm template <release> <chart> --namespace <ns> --values values.yaml > manifests.yaml
      File may contain multiple documents separated by `---`; each must include `kind` and `apiVersion`.
    required: true
  base-url:
    description: 'Base URL for the Averlon API service'
    required: false
    default: 'https://wfe.prod.averlon.io/'
  cloud-id:
    description: 'secdi Cloud ID for issue lookup. Leave blank to auto-detect.'
    required: false
  region:
    description: 'Cloud region for resource ID generation (e.g., us-west-2 for AWS, eastus for Azure). If not provided, will be auto-detected from manifest metadata.'
    required: false
  cluster:
    description: 'Cluster name for resource ID generation (e.g., my-cluster). If not provided, will be auto-detected from manifest metadata.'
    required: false
  namespace:
    description: 'Kubernetes namespace used for the Helm release (overrides autodetected value from dry run output)'
    required: false
  release-name:
    description: 'Release name used for the Helm release (overrides autodetected value from dry run output)'
    required: false
  github-token:
    description: |
      GitHub token for creating issues and syncing linked pull requests.
      Defaults to the workflow GITHUB_TOKEN when omitted.
      Workflow must grant pull-requests: read (in addition to issues: write) so linked Copilot PRs can be registered.
      Provide a separate PAT with Copilot access to enable automatic Copilot assignment.
    required: false
  filters:
    description: |
      Severity filters (comma-separated). Supported values: Critical, High, Medium, Low.
      Example: "Critical,High"
    required: false
    default: 'Critical,High'
  resource-type-filter:
    description: |
      Filter by specific Kubernetes resource types (comma-separated). 
      Example: "Deployment,StatefulSet,DaemonSet"
      If not specified, all resource types are included.
    required: false
  namespace-filter:
    description: |
      Filter by specific namespaces (comma-separated).
      Example: "default,production,staging"
      If not specified, all namespaces are included.
    required: false
  verbose:
    description: 'If true, log full helm output for debugging'
    required: false
    default: 'false'

runs:
  using: 'node20'
  main: 'dist/main.js'

outputs:
  analysis-json:
    description: 'Compact JSON summary (chart, release, namespace, totals)'
  analysis-json-path:
    description: 'Path to the JSON file written to disk'

branding:
  icon: 'package'
  color: 'purple'
