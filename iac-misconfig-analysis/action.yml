name: 'Averlon Misconfiguration Remediation Agent for IaC'
description: 'Correlate Terraform and Pulumi plan changes with existing Averlon misconfigurations'
author: 'Averlon'
inputs:
  averlon-api-key:
    description: 'Averlon API key'
    required: true
  averlon-api-secret:
    description: 'Averlon API secret'
    required: true
  api-key:
    description: '[Deprecated] Averlon API key (use averlon-api-key instead)'
    required: false
  api-secret:
    description: '[Deprecated] Averlon API secret (use averlon-api-secret instead)'
    required: false
  commit:
    description: 'Commit SHA to scan'
    required: false
  iac-type:
    description: 'IaC type to analyze: terraform or pulumi'
    required: false
    default: 'terraform'
  plan-path:
    description: 'Path to the Terraform plan file (required for terraform)'
    required: false
  pulumi-stack-path:
    description: 'Path to JSON output from `pulumi stack export` (required for pulumi)'
    required: false
  cloud-id:
    description: 'Averlon cloud ID used for existing issue correlation'
    required: false
  base-url:
    description: 'Averlon API base URL'
    required: false
    default: 'https://wfe.prod.averlon.io/'
  github-token:
    description: |
      GitHub token for creating issues and syncing linked pull requests.
      Workflow must grant pull-requests: read (in addition to issues: write) so linked Copilot PRs can be registered.
      Provide a PAT with Copilot access when auto-assign-copilot is true.
    required: false
  auto-assign-copilot:
    description: "Auto-assign issues to GitHub Copilot agent for automatic fixes (requires github-token to be a PAT with GitHub Copilot access, not GITHUB_TOKEN)"
    required: false
    default: "false"
  resource-type-filter:
    description: |
      Filter by specific resource types (comma-separated).
      Terraform example: "aws_s3_bucket,aws_lambda_function"
      Pulumi example: "aws:s3/bucket:Bucket,aws:iam/role:Role"
      If not specified, all resource types are included.
    required: false
  filters:
    description: |
      Severity filters (comma-separated). Supported values: Critical, High, Medium, Low.
      Example: "Critical,High"
    required: false
    default: "Critical,High"
runs:
  using: 'node20'
  main: 'dist/main.js'
branding:
  icon: 'git-branch'
  color: 'blue'
