name: 'Averlon Vulnerability Remediation Agent for Containers'
description: 'Docker and container security analysis with vulnerability detection and remediation'
author: 'Averlon'

inputs:
  averlon-api-key:
    description: 'API key for Averlon authentication (GitActions-scoped)'
    required: true
  averlon-api-secret:
    description: 'API secret for Averlon authentication (GitActions-scoped)'
    required: true
  anthropic-api-key:
    description: 'API key for Anthropic Claude. Not needed when use-bedrock is true.'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for claude-code-action (contents: write, pull-requests: write)'
    required: true
  mcp-api-key:
    description: 'API key for Averlon MCP server (MCPClient-scoped)'
    required: true
    default: ''
  mcp-api-secret:
    description: 'API secret for Averlon MCP server (MCPClient-scoped)'
    required: true
    default: ''
  dockerfile:
    description: 'Path to the Dockerfile to remediate (e.g. "Dockerfile" or "api/Dockerfile")'
    required: true
  image-repository:
    description: 'Image repository for the Dockerfile (e.g. "registry.io/org/app")'
    required: false
    default: ''
  base-url:
    description: 'Base URL for the Averlon API and MCP server'
    required: false
    default: 'https://wfe.prod.averlon.io/'
  filters:
    description: |
      Recommendation Filters (comma-separated). Choose from: Recommended, Exploited, Critical, High, HighRCE, Medium, MediumApplication, Low, LowApplication.
      Example: 'Recommended,Critical,HighRCE'
    required: false
    default: 'Recommended,Critical,HighRCE'
  disable-websearch:
    description: 'Disable the WebSearch tool for Coding Agent'
    required: false
    default: 'false'
  model:
    description: 'Claude model to use for remediation. Defaults to claude-opus-5, or us.anthropic.claude-opus-5 with use-bedrock. See supported models in README.'
    required: false
    default: ''
  use-bedrock:
    description: 'Run the Coding Agent against Claude on Amazon Bedrock instead of the Anthropic API. AWS credentials and AWS_REGION must be in the workflow environment.'
    required: false
    default: 'false'
  container-engine:
    description: |
      Command used to run the Averlon MCP server container, when the runner keeps
      it outside PATH or under another name. Either a name on PATH ('docker',
      'podman') or an absolute path (e.g. '/opt/podman/bin/podman').
      Left empty, the action uses docker if present and podman otherwise.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: 'Prepare Coding Agent'
      id: model
      shell: bash
      run: bash "${{ github.action_path }}/scripts/prepare-agent.sh"
      env:
        MODEL: ${{ inputs.model }}
        USE_BEDROCK: ${{ inputs.use-bedrock }}

    - name: 'Validate Anthropic API key'
      if: inputs.use-bedrock != 'true'
      shell: bash
      run: node "${{ github.action_path }}/dist/validate-anthropic-key.js"
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}

    - name: 'Download Averlon skills'
      id: setup-skill
      shell: bash
      run: node "${{ github.action_path }}/dist/setup-skills.js"
      env:
        AVERLON_API_KEY: ${{ inputs.averlon-api-key }}
        AVERLON_API_SECRET: ${{ inputs.averlon-api-secret }}
        AVERLON_BASE_URL: ${{ inputs.base-url }}

    - name: 'Create MCP Config'
      id: mcp-config
      shell: bash
      run: bash "${{ github.action_path }}/scripts/create-mcp-config.sh"
      env:
        MCP_API_KEY: ${{ inputs.mcp-api-key || inputs.averlon-api-key }}
        MCP_API_SECRET: ${{ inputs.mcp-api-secret || inputs.averlon-api-secret }}
        SECDI_SERVER: ${{ inputs.base-url }}
        MCP_IMAGE_REF: ${{ steps.setup-skill.outputs.mcp-image-ref }}
        CONTAINER_ENGINE: ${{ inputs.container-engine }}

    - name: 'Get Averlon recommendations'
      id: averlon
      shell: bash
      run: node "${{ github.action_path }}/dist/main.js"
      env:
        AVERLON_API_KEY: ${{ inputs.averlon-api-key }}
        AVERLON_API_SECRET: ${{ inputs.averlon-api-secret }}
        AVERLON_BASE_URL: ${{ inputs.base-url }}
        INPUT_DOCKERFILE: ${{ inputs.dockerfile }}
        INPUT_IMAGE_REPOSITORY: ${{ inputs.image-repository }}
        INPUT_FILTERS: ${{ inputs.filters }}
        INPUT_DISABLE_WEBSEARCH: ${{ inputs.disable-websearch }}

    - name: 'Run Coding Agent'
      id: codingagent
      if: steps.averlon.outputs.has-recommendations == 'true'
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      with:
        use_bedrock: ${{ inputs.use-bedrock }}
        anthropic_api_key: ${{ inputs.anthropic-api-key }}
        github_token: ${{ inputs.github-token }}
        prompt: ${{ steps.averlon.outputs.prompt }}
        claude_args: |
          --model ${{ steps.model.outputs.model }}
          --mcp-config ${{ steps.mcp-config.outputs.config-path }}
          --allowedTools "${{ steps.averlon.outputs.allowed-tools }}"
          --json-schema '${{ steps.averlon.outputs.json-schema }}'
          --max-turns ${{ steps.setup-skill.outputs.agent-max-turns }}

    - name: 'Submit Agent Feedback'
      if: always()
      shell: bash
      run: node "${{ github.action_path }}/dist/submit-feedback.js"
      env:
        AVERLON_API_KEY: ${{ inputs.averlon-api-key }}
        AVERLON_API_SECRET: ${{ inputs.averlon-api-secret }}
        AVERLON_BASE_URL: ${{ inputs.base-url }}
        AVERLON_CLOUD_ID: ${{ steps.averlon.outputs.cloud-id }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        CODING_AGENT_OUTPUT: ${{ steps.codingagent.outputs.structured_output }}
        ALL_CODE_DEFECT_IDS: ${{ steps.averlon.outputs.code-defect-ids }}

    - name: 'Verify Anthropic API key after agent failure'
      if: always() && steps.codingagent.outcome == 'failure' && inputs.use-bedrock != 'true'
      shell: bash
      run: node "${{ github.action_path }}/dist/validate-anthropic-key.js"
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        ANTHROPIC_KEY_CHECK_STAGE: 'post-agent'

    - name: 'Cleanup MCP Config'
      if: always()
      shell: bash
      run: rm -rf "${{ steps.mcp-config.outputs.config-dir }}"

    - name: 'Cleanup Averlon skill'
      if: always()
      shell: bash
      run: node "${{ github.action_path }}/dist/cleanup-skills.js"
      env:
        SKILL_NAMES: ${{ steps.setup-skill.outputs.skill-names }}
        CREATED_CLAUDE_DIR: ${{ steps.setup-skill.outputs.created-claude-dir }}
        CREATED_SKILLS_DIR: ${{ steps.setup-skill.outputs.created-skills-dir }}

branding:
  icon: 'shield'
  color: 'blue'
