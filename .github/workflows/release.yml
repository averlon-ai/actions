name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3'

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Build all actions
        run: bun run build

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Update action usage examples to release version
        run: bun scripts/update-action-versions.ts "${{ steps.get_version.outputs.VERSION }}"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit built files to release tag
        run: |
          # Add the built files for all actions using the discover script
          ACTION_DIRS=$(./scripts/discover-actions.sh)

          # Stage doc/template updates for the new version
          git add -A

          for ACTION_NAME in $ACTION_DIRS; do
            git add -f "$ACTION_NAME/dist/"
          done

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Commit the built files
            git commit -m "Add built files for release ${{ steps.get_version.outputs.VERSION }}"
            
            # Update the tag to point to the new commit with built files
            git tag -f ${{ steps.get_version.outputs.VERSION }}
            git push origin ${{ steps.get_version.outputs.VERSION }} --force
          fi

      # The notes go to the release step as a file, never as its `body:` input: GitHub evaluates
      # every expression in a step's inputs, so the installation example's
      # `${{ secrets.GITHUB_TOKEN }}` published the job's token (scripts/release-notes.ts).
      - name: Write the release notes
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: bun scripts/release-notes.ts "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Create Release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: true
          prerelease: false
